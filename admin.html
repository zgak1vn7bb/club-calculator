<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密生成工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei",sans-serif;}
body{background:#1c1a11;min-height:100vh;padding:20px;color:#d8c8a0;}
.container{max-width:700px;margin:0 auto;}
h1{color:#e6c264;text-align:center;margin-bottom:20px;font-size:20px;}
.card{background:#272418;border:1px solid #645126;border-radius:8px;padding:16px;margin-bottom:16px;}
.card h2{color:#e6c264;font-size:15px;margin-bottom:12px;}
.field-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:#8a7d5a;}
.field input,.field select{padding:7px 10px;background:#14130d;border:1px solid #635024;border-radius:5px;color:#f0e8cc;font-size:13px;outline:none;}
.field input:focus,.field select:focus{border-color:#d4b058;}
.btn{padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px;border:1px solid #635024;transition:all .2s;}
.btn-gen{background:#1f3a2a;border-color:#3a8b5a;color:#84e8a8;}
.btn-gen:hover{background:#284a35;}
.btn-copy{background:#1f2a3a;border-color:#3a5a8b;color:#84b8e8;}
.btn-copy:hover{background:#283a4a;}
.output-box{width:100%;min-height:200px;padding:10px;background:#14130d;border:1px solid #635024;border-radius:6px;color:#6ee07a;font-family:monospace;font-size:12px;resize:vertical;outline:none;}
.output-box.plain{color:#ffd770;}
.tip{font-size:11px;color:#8a7d5a;line-height:1.6;margin-top:8px;}
.tip code{background:#14130d;padding:1px 5px;border-radius:3px;color:#d4b058;}
.tab-row{display:flex;gap:4px;margin-bottom:12px;}
.tab{flex:1;text-align:center;padding:8px;border:1px solid #635024;border-radius:6px;cursor:pointer;font-size:12px;color:#b8a678;background:#1e1b12;}
.tab.active{background:#5c4920;border-color:#d4b058;color:#ffdd90;}
.section{display:none;}
.section.active{display:block;}
</style>
</head>
<body>
<div class="container">
    <h1>卡密生成工具</h1>

    <div class="tab-row">
        <div class="tab active" onclick="switchTab('gen')">批量生成卡密</div>
        <div class="tab" onclick="switchTab('single')">单卡查询哈希</div>
    </div>

    <!-- 批量生成 -->
    <div id="tab-gen" class="section active">
        <div class="card">
            <h2>生成配置</h2>
            <div class="field-row">
                <div class="field"><label>生成数量</label><input type="number" id="genCount" value="10" min="1" max="200" style="width:80px;"></div>
                <div class="field"><label>类型</label>
                    <select id="genType" style="width:100px;">
                        <option value="perm">永久</option>
                        <option value="days">限时</option>
                    </select>
                </div>
                <div class="field" id="daysField" style="display:none;"><label>有效天数</label><input type="number" id="genDays" value="30" min="1" style="width:80px;"></div>
                <div class="field"><label>备注</label><input type="text" id="genNote" placeholder="选填" style="width:120px;"></div>
                <button class="btn btn-gen" onclick="generateKeys()">生成</button>
            </div>
        </div>

        <div class="card">
            <h2>明文卡密（复制发给用户）</h2>
            <textarea class="output-box plain" id="plainOutput" readonly placeholder="点击生成后显示..."></textarea>
            <div style="margin-top:8px;"><button class="btn btn-copy" onclick="copyText('plainOutput')">复制明文卡密</button></div>
        </div>

        <div class="card">
            <h2>哈希数据（复制粘贴到 index.html 的 KEY_DATA 数组里）</h2>
            <textarea class="output-box" id="hashOutput" readonly placeholder="点击生成后显示..."></textarea>
            <div style="margin-top:8px;"><button class="btn btn-copy" onclick="copyText('hashOutput')">复制哈希数据</button></div>
            <div class="tip">
                使用方法：打开 <code>index.html</code>，找到 <code>const KEY_DATA = [</code>，把上面的哈希行粘贴进去（每行一个）。<br>
                格式说明：<code>{ h: "哈希值", t: "perm", n: "备注" }</code> 永久卡；<code>{ h: "哈希值", t: "days", d: 30, n: "备注" }</code> 限时卡。
            </div>
        </div>
    </div>

    <!-- 单卡查询 -->
    <div id="tab-single" class="section">
        <div class="card">
            <h2>输入明文卡密，计算哈希</h2>
            <div class="field-row">
                <div class="field" style="flex:1;"><label>卡密</label><input type="text" id="singleKey" placeholder="例如 ABCD-1234-EFGH-5678" style="width:100%;"></div>
                <button class="btn btn-gen" onclick="calcSingle()">计算</button>
            </div>
            <div class="field" style="margin-top:10px;">
                <label>SHA256 哈希</label>
                <input type="text" id="singleHash" readonly style="width:100%;background:#14130d;border:1px solid #635024;border-radius:5px;color:#6ee07a;padding:7px 10px;font-family:monospace;font-size:12px;">
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('genType').addEventListener('change', function() {
    document.getElementById('daysField').style.display = this.value === 'days' ? 'flex' : 'none';
});

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}

function generateKeyStr() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let key = '';
    for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) key += chars[Math.floor(Math.random() * chars.length)];
        if (i < 3) key += '-';
    }
    return key;
}

async function sha256(text) {
    const enc = new TextEncoder();
    const buf = await crypto.subtle.digest('SHA-256', enc.encode(text.trim().toUpperCase()));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function generateKeys() {
    const count = parseInt(document.getElementById('genCount').value) || 10;
    const type = document.getElementById('genType').value;
    const days = parseInt(document.getElementById('genDays').value) || 30;
    const note = document.getElementById('genNote').value || '';

    const plainLines = [];
    const hashLines = [];

    for (let i = 0; i < count; i++) {
        const key = generateKeyStr();
        const hash = await sha256(key);
        plainLines.push(key);
        if (type === 'perm') {
            hashLines.push('    { h: "' + hash + '", t: "perm", n: "' + note + '" },');
        } else {
            hashLines.push('    { h: "' + hash + '", t: "days", d: ' + days + ', n: "' + note + '" },');
        }
    }

    document.getElementById('plainOutput').value = plainLines.join('\n');
    document.getElementById('hashOutput').value = hashLines.join('\n');
}

async function calcSingle() {
    const key = document.getElementById('singleKey').value.trim();
    if (!key) return;
    const hash = await sha256(key);
    document.getElementById('singleHash').value = hash;
}

function copyText(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
    alert('已复制到剪贴板');
}
</script>
</body>
</html>
